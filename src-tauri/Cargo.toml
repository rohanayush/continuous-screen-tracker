[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The debug APK ships unstripped Rust libraries and lands north of 100 MB.
# Release builds for distribution want the opposite of debuggability.
[profile.release]
opt-level = "z"     # optimise for size, not speed — this app does almost nothing hot
lto = true          # drop everything unreachable across crates
codegen-units = 1   # better size at the cost of a slower build
panic = "abort"     # no unwinding tables
strip = true        # symbols are the bulk of the weight

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

